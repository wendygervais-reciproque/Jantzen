<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Paris — Base photographique Jantzen</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"/>
  <link rel="stylesheet" href="src/css/tokens.css"/>
  <link rel="stylesheet" href="src/css/main.css"/>
</head>
<body>
<div id="app">

  <!-- ── HEADER ── -->
  <header id="header">
    <div id="header-brand">
      <span class="brand-main">Jul 23 2026 15:51:50</span>
    </div>

    <div id="header-search">
      <div id="search-input-wrap">
        <input type="search" id="search-input"
               placeholder="Nom, adresse, élément architectural…"
               autocomplete="off"
               aria-label="Recherche dans le fonds"/>
        <button id="search-clear" aria-label="Effacer la recherche">×</button>
      </div>
    </div>

    <nav id="header-nav" aria-label="Navigation principale">
      <a href="#" onclick="showPage('carte'); return false;" class="active" id="nav-carte">Carte</a>
      <a href="#" onclick="showPage('base');  return false;" id="nav-base">La base</a>
      <a href="#" onclick="showPage('projet');return false;" id="nav-projet">Le projet</a>
    </nav>
  </header>

  <!-- ── MAIN ── -->
  <div id="main">

    <!-- MAP ROW -->
    <div id="map-row">

      <!-- MAP CONTAINER -->
      <div id="map-container">
        <div id="map" role="application" aria-label="Carte interactive de Paris"></div>

        <!-- DETAIL PANEL (Panneau de gauche, fiche bâtiment) -->
        <div id="detail-panel"
             role="region"
             aria-label="Détail du bâtiment"
             aria-hidden="true">
          <div id="detail-gallery" aria-label="Galerie photographique"></div>
          <div id="detail-content" tabindex="0">
            <h2 id="detail-title"></h2>
            <p id="detail-address"></p>
            <div class="detail-meta-grid" id="detail-meta-grid"></div>
            <p id="detail-description"></p>
            <span class="detail-elements-label" id="detail-elements-label">Éléments architecturaux (Index Jantzen)</span>
            <div class="detail-elements" id="detail-elements-tags"></div>
          </div>
          <button id="detail-close" aria-label="Fermer la fiche">×</button>
        </div>

        <!-- FILTERS PANEL (Panneau flottant en haut à droite) -->
        <div id="filters-panel" aria-label="Filtres">
          <div id="filters-header">
            <div id="filters-header-top">
              <span id="filters-title">Filtres</span>
              <div id="filters-header-right">
                <span id="search-results-count" aria-live="polite"></span>
                <button id="filters-toggle" aria-label="Afficher/Masquer les filtres" aria-expanded="true">−</button>
              </div>
            </div>
            <div id="filters-active-bar" aria-live="polite"></div>
          </div>
          <div id="filters-body">

            <div class="filter-section">
              <button class="filter-section-header" onclick="toggleFilterSection(this)" aria-expanded="true">
                <span class="filter-section-label">Arrondissement</span>
                <span class="filter-section-arrow" aria-hidden="true">▾</span>
              </button>
              <div class="filter-section-body open">
                <div class="filter-group">
                  <div class="filter-chips" id="arr-chips"></div>
                </div>
              </div>
            </div>

            <div class="filter-section">
              <button class="filter-section-header" onclick="toggleFilterSection(this)" aria-expanded="false">
                <span class="filter-section-label">Thésaurus (Index Jantzen)</span>
                <span class="filter-section-arrow" aria-hidden="true">▾</span>
              </button>
              <div class="filter-section-body">
                <div class="filter-chips" id="thesaurus-chips"></div>
              </div>
            </div>

          </div>
        </div>

        <!-- LIENS DISCRETS (en bas à gauche) -->
        <div id="footer-links">
          <a href="#" onclick="showPage('credits'); return false;">Crédits</a>
          <span>·</span>
          <a href="#" onclick="showPage('cgu'); return false;">CGU</a>
        </div>

      </div><!-- end #map-container -->
    </div><!-- end #map-row -->

    <!-- STRIP RESIZER (Tirette de redimensionnement) -->
    <div id="strip-resizer" role="separator" aria-label="Redimensionner le bandeau" title="Glisser pour ajuster la hauteur"></div>

    <!-- RESULTS STRIP (Bandeau horizontal de résultats) -->
    <div id="results-strip" aria-label="Résultats">
      <div id="results-track-wrap">
        <div id="empty-state" aria-live="polite">
          <p>Aucun résultat.<br>Modifiez vos critères de recherche.</p>
        </div>
        <div id="results-track" role="list" aria-label="Résultats"></div>
      </div>
    </div>

  </div><!-- end #main -->
</div><!-- end #app -->

<!-- ── OVERLAY PAGES STATIQUES ── -->
<div id="page-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <header id="page-overlay-header">
    <span id="page-overlay-title"></span>
    <button id="page-overlay-close" aria-label="Fermer">×</button>
  </header>
  <div id="page-overlay-body"></div>
</div>

<!-- ── SCRIPTS ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script src="src/js/data.js"></script>
<script src="src/js/map.js"></script>
<script src="src/js/search.js"></script>
<script src="src/js/filters.js"></script>
<script src="src/js/ui.js"></script>
<script src="src/js/pages.js"></script>
<script src="src/js/app.js"></script>
</body>
</html>
