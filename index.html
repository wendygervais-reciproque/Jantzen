<div id="app">

  <!-- ── MARQUE + À PROPOS ── -->
  <nav id="brand-bar" aria-label="Navigation principale">
    <h1 id="brand-heading"><a href="" id="brand-home">DEV 30/09/2026 17h00 BETA 1.4</a></h1>
    <span class="brand-sep" aria-hidden="true"></span>
    <a href="#" id="brand-about">À propos</a>
  </nav>

  <!-- ── RECHERCHE ── -->
  <div id="search-bar" role="search">
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="search" id="search-input"
           placeholder="Nom, adresse, élément architectural…"
           autocomplete="off"
           aria-label="Recherche dans le fonds"/>
    <button id="search-clear" aria-label="Effacer la recherche" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>

  <!-- ── BASCULE CARTE / MOSAÏQUE ── -->
  <div id="view-toggle" role="group" aria-label="Mode d'affichage">
    <button class="view-btn is-active" data-view="map" aria-pressed="true" aria-label="Vue carte">
      <svg class="icon" aria-hidden="true"><use href="#i-map"/></svg>
    </button>
    <button class="view-btn" data-view="mosaic" aria-pressed="false" aria-label="Vue mosaïque">
      <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>
    </button>
  </div>

  <!-- ── FILTRES ── -->
  <!-- Déclencheur mobile/tablette (≤900px) : bouton icône flottant, remplace
       #filters-toggle qui n'a de sens qu'en desktop (repli en place, pas
       fermeture d'une modale). -->
  <button id="filters-fab" type="button"
          aria-haspopup="dialog" aria-controls="filters-panel"
          aria-expanded="false" aria-label="Filtres">
    <svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>
    <span id="filters-fab-badge" class="fab-badge" hidden></span>
  </button>

  <div id="filters-panel" role="region" aria-label="Filtres">
    <div id="filters-header">
      <div id="filters-header-top">
        <h2 id="filters-title">Filtres</h2>
        <div id="filters-header-right">
          <span id="search-results-count" aria-live="polite"></span>
          <button id="filters-toggle" aria-label="Afficher/Masquer les filtres" aria-expanded="true">
            <svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg>
          </button>
          <button id="filters-close" class="modal-close-btn" type="button" aria-label="Fermer les filtres">
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
      </div>
      <div id="filters-active-bar" aria-live="polite"></div>
    </div>
    <div id="filters-body">

      <div class="filter-section">
        <div class="filter-section-sentinel" aria-hidden="true"></div>
        <h3 class="filter-section-heading">
          <button class="filter-section-header" onclick="toggleFilterSection(this)" aria-expanded="false" aria-label="Section de filtre : Arrondissement">
            <span class="filter-section-label">Arrondissements</span>
            <span class="filter-section-ctrl">
              <svg class="icon filter-section-arrow" aria-hidden="true"><use href="#i-chevron"/></svg>
            </span>
          </button>
        </h3>
        <div class="filter-section-body">
          <div class="filter-group">
            <div id="arr-chips" class="filter-chips" ></div>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-section-sentinel" aria-hidden="true"></div>
        <h3 class="filter-section-heading">
          <button class="filter-section-header" onclick="toggleFilterSection(this)" aria-expanded="false" aria-label="Section de filtre : Temporalité">
            <span class="filter-section-label">Périodes</span>
            <span class="filter-section-ctrl">
              <svg class="icon filter-section-arrow" aria-hidden="true"><use href="#i-chevron"/></svg>
            </span>
          </button>
        </h3>
        <div class="filter-section-body">
          <div id="date-filter">
            <div id="date-chips-container" class="thes-terms"></div>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-section-sentinel" aria-hidden="true"></div>
        <h3 class="filter-section-heading">
          <button class="filter-section-header" onclick="toggleFilterSection(this)" aria-expanded="false" aria-label="Section de filtre : Thésaurus (Index Jantzen)">
            <span class="filter-section-label">Éléments architecturaux</span>
            <span class="filter-section-ctrl">
              <svg class="icon filter-section-arrow" aria-hidden="true"><use href="#i-chevron"/></svg>
            </span>
          </button>
        </h3>
        <div class="filter-section-body">
          <div class="thes-search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" id="thesaurus-search"
                   placeholder="Rechercher un terme…"
                   autocomplete="off"
                   aria-label="Rechercher un terme dans le thésaurus"
                   aria-controls="thesaurus-groups"/>
            <button type="button" id="thesaurus-search-clear" class="thes-search-clear" aria-label="Effacer la recherche" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
          </div>
          <div id="thesaurus-groups"></div>
          <p id="thesaurus-empty" class="thes-empty" hidden aria-live="polite">
            Aucun terme ne correspond à cette recherche.
          </p>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-section-sentinel" aria-hidden="true"></div>
        <h3 class="filter-section-heading">
          <button class="filter-section-header" onclick="toggleFilterSection(this)" aria-expanded="false" aria-label="Section de filtre : Architectes">
            <span class="filter-section-label">Architectes & Artistes</span>
            <span class="filter-section-ctrl">
              <svg class="icon filter-section-arrow" aria-hidden="true"><use href="#i-chevron"/></svg>
            </span>
          </button>
        </h3>
        <div class="filter-section-body">
          <div class="thes-search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" id="archi-search"
                   placeholder="Rechercher une personne..."
                   autocomplete="off"
                   aria-label="Rechercher une personne"
                   aria-controls="archi-chips-container"/>
            <button type="button" id="archi-search-clear" class="thes-search-clear" aria-label="Effacer la recherche" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
          </div>
          <div id="archi-chips-container" class="thes-terms" style="margin-top: 8px;"></div>
          <p id="archi-empty" class="thes-empty" hidden aria-live="polite">
            Aucune personne ne correspond à cette recherche.
          </p>
        </div>
      </div>

    </div>

    <!-- Barre basse sticky, mobile/tablette uniquement (voir media query
         dans main.css) : rappelle le nombre de résultats et permet de
         refermer la modale sans remonter jusqu'à la croix, quelle que soit
         la profondeur de défilement dans les filtres. -->
    <div id="filters-footer">
      <span id="filters-footer-count" aria-live="polite"></span>
      <button id="filters-footer-back" type="button">Retour aux résultats</button>
    </div>
  </div>

  <!-- ── FOND : carte ou mosaïque ──
       Après le chrome (marque, recherche, bascule, filtres) plutôt qu'avant :
       tout est positionné en absolute/fixed (voir #app/#stage dans main.css),
       donc l'ordre du DOM ne pèse que sur l'ordre de tabulation — placé en
       tête, #stage faisait passer le clavier par les centaines de POI/grappes
       de la carte avant d'atteindre le moindre bouton de l'interface. -->
  <main id="stage">
    <div id="map" role="application" aria-label="Carte interactive de Paris"></div>
    <div id="mosaic" role="region" hidden aria-label="Mosaïque des bâtiments"></div>
    <p id="stage-empty" role="status" aria-live="polite"></p>
  </main>

  <!-- ── VOLET DÉTAIL BÂTIMENT (infos + photos) — carte et mosaïque ── -->
  <aside id="mosaic-detail" aria-label="Détail du bâtiment" hidden>
    <button id="mosaic-detail-close" class="modal-close-btn" aria-label="Fermer la fiche">
      <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
    <div id="mosaic-detail-body">
      <div id="md-info"></div>
      <div class="md-sticky-sentinel" aria-hidden="true"></div>
      <div id="md-photos-header" hidden>
        <p id="md-photos-context"></p>
        <h3 class="md-section-title" id="md-photos-label">Photographie(s)</h3>
        <button class="filter-section-header" id="md-elem-toggle"
                aria-expanded="false" aria-controls="md-elem-groups">
          <span class="filter-section-label">Éléments architecturaux</span>
          <span class="filter-section-ctrl">
            <svg class="icon filter-section-arrow" aria-hidden="true"><use href="#i-chevron"/></svg>
          </span>
        </button>
        <div id="md-elem-groups" class="archi-groups" hidden></div>
      </div>
      <div id="md-photos"></div>
    </div>
    <!-- Tirette de redimensionnement -->
    <div id="mosaic-detail-handle" class="panel-resize" role="separator"
         aria-orientation="vertical" tabindex="0"
         aria-label="Redimensionner le volet des informations"
         aria-valuemin="400" aria-valuemax="900" aria-valuenow="400">
      <svg class="icon panel-resize-grip" aria-hidden="true"><use href="#i-drag"/></svg>
    </div>
  </aside>

  <!-- ── LIENS DISCRETS ── -->
  <div id="footer-links">
    <a href="https://www.musee-orsay.fr/fr/mentions-legales" target="_blank" rel="noopener">Mentions légales</a>
  </div>

</div><!-- end #app -->

<!-- ── VISIONNEUSE PLEIN ÉCRAN ── -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photographie en plein écran" hidden>
  <button id="lightbox-close" aria-label="Fermer">
    <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
  </button>
  <figure id="lightbox-figure">
    <div id="lightbox-img-wrap">
      <img id="lightbox-img" alt=""/>
    </div>
    <figcaption id="lightbox-caption"></figcaption>
    <div id="lightbox-nav-row">
      <button class="lightbox-nav" id="lightbox-prev" aria-label="Photo précédente">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
      </button>
      <button class="lightbox-nav" id="lightbox-next" aria-label="Photo suivante">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>
      </button>
    </div>
  </figure>
</div>

<!-- ── PAGES STATIQUES ── -->
<div id="page-overlay" role="dialog" aria-modal="true" aria-labelledby="page-overlay-title" aria-hidden="true" hidden>
  <header id="page-overlay-header">
    <span id="page-overlay-title"></span>
    <button id="page-overlay-close" class="modal-close-btn" aria-label="Fermer">
      <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </header>
  <div id="page-overlay-tabs" role="tablist" aria-label="Sections" hidden></div>
  <div id="page-overlay-body"></div>
</div>

<!-- ── SCRIPTS ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"></script>
<script src="/src/js/data.js"></script>
